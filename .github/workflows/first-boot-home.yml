name: Shared Home first-boot recovery
on:
  push:
    branches: [feat/universal-watch]
    paths: ['.github/workflows/first-boot-home.yml']
permissions:
  contents: write
jobs:
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-watch
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 14762601b3fa7bbeeac5ed565a6825534bf74dca
          path: .source/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: fc0bdbbbc600ce891e60c44d091fce0586ade7d8
          path: .source/utilities
          persist-credentials: false
      - name: Apply source migration and exercise real Home entry point
        run: |
          python3 provenance/apply_first_boot_0141.py
          python3 scripts/test_fast_wake_clock.py --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_capabilities.py --sanitize
          python3 scripts/test_viewport.py --sanitize
          python3 scripts/check_capability_boundaries.py
      - name: Commit validated source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps tests
          if ! git diff --cached --quiet; then
            git commit -m 'Keep shared Home running with unset RTC and absent alarm service'
            git push origin HEAD:feat/universal-watch
          fi
