name: Universal watch application
on:
  push:
    branches: [feat/universal-watch, main, work/native-height-layout-20261013]
    paths: ['apps/**', 'sdk/**', 'include/**', 'scripts/**', 'tests/**', '.github/workflows/universal-watch.yml', 'dependencies.lock.json']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 076f8da38f7dfebdfde6dd5d46e06446470fb828
          path: .source/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: fc0bdbbbc600ce891e60c44d091fce0586ade7d8
          path: .source/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: 422e1e81a498fb6bdab9abf086325afc05a532dc
          path: .source/drivers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 5323d1e834bdcc8e5e9fb0e8f76c383e46626801
          path: .source/runtime
          persist-credentials: false
      - name: Generic contracts, independent services and display classes
        run: |
          for f in RiscPowerSleepV1.h RiscPowerKeyV1.h RiscDisplayPowerV1.h; do cmp "sdk/driver/$f" ".source/drivers/sdk/driver/$f"; done
          python3 tests/test_build_inputs.py
          python3 scripts/check_capability_boundaries.py
          python3 scripts/test_capabilities.py
          python3 scripts/test_fast_wake_clock.py --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_clock_raster_gestures.py --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_home_native_height.py
          python3 scripts/test_fast_wake_clock.py --native --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_clock_raster_gestures.py --native --output dist/clock-raster-gestures-native --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_watch_layout.py
          python3 scripts/test_return_default.py --runtime .source/runtime
          python3 scripts/test_return_default.py --runtime .source/runtime --sanitize
          python3 scripts/test_capabilities.py --sanitize
          python3 scripts/test_viewport.py
          python3 scripts/test_viewport.py --sanitize
          python3 .source/drivers/scripts/test_legacy_power_bridge.py --sdk "$PWD/sdk/driver"
          python3 .source/drivers/scripts/test_legacy_power_bridge.py --sdk "$PWD/sdk/driver" --sanitize
      - name: Prepare pinned compiler
        run: |
          mkdir -p .source/toolchain
          curl --fail --location --retry 2 --max-time 180 https://github.com/espressif/crosstool-NG/releases/download/esp-2021r2-patch5/xtensa-esp32s3-elf-gcc8_4_0-esp-2021r2-patch5-linux-amd64.tar.gz -o "$RUNNER_TEMP/toolchain.tar.gz"
          echo "8aa17a6adf01efa5b1628c8ac578063a44d26ae9581d39486b92223a41ef262f  $RUNNER_TEMP/toolchain.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/toolchain.tar.gz" -C .source/toolchain
          python3 -m pip install -r scripts/requirements.txt
      - name: Build and validate shared ELFs
        run: |
          python3 scripts/build.py --system .source/system --utilities .source/utilities --cc "$PWD/.source/toolchain/xtensa-esp32s3-elf/bin/xtensa-esp32s3-elf-gcc"
          python3 .source/drivers/scripts/build_legacy_power_bridge.py --watch-sdk "$PWD" --cc "$PWD/.source/toolchain/xtensa-esp32s3-elf/bin/xtensa-esp32s3-elf-gcc" --validator dist/validate-elf --output dist/generic-power
          git rev-parse HEAD > dist/COMMIT.txt
          git archive HEAD | gzip > dist/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: universal-watch-app
          path: |
            dist/default.elf
            dist/default.json
            dist/clock.elf
            dist/clock.json
            dist/generic-power/**/driver.elf
            dist/generic-power/**/manifest.json
            dist/generic-power/build.json
            dist/build.json
            dist/COMMIT.txt
            dist/source.tar.gz
          retention-days: 30
