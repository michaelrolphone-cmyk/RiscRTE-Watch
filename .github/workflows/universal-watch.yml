name: Universal watch application
on:
  push:
    branches: [feat/universal-watch, main, work/native-height-layout-20261013, fix/native-watch-faces-20261015, work/unified-default-capabilities, work/serial-service-checkpoint, fix/mounted-sd-sleep-20261017, fix/home-first-exit-checkpoint]
    paths: ['apps/**', 'sdk/**', 'include/**', 'scripts/**', 'tests/**', '.github/workflows/universal-watch.yml', 'dependencies.lock.json']
  pull_request:
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: 1
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - id: deps
        name: Read source-owned dependency pins
        run: |
          python3 - <<'PYTHON'
          import json, os
          pins=json.load(open('dependencies.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              for name in ('system','utilities'):
                  print(f"{name}={pins[name]['commit']}",file=output)
          PYTHON
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: ${{ steps.deps.outputs.system }}
          path: .source/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: ${{ steps.deps.outputs.utilities }}
          path: .source/utilities
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Drivers
          ref: 422e1e81a498fb6bdab9abf086325afc05a532dc
          path: .source/drivers
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 34716712d4cb7f25fda56a540aafc652c924c995
          path: .source/runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Watch
          ref: b00d4e7d36fc69c8defd250a82f6af077c732137
          path: .source/baseline-watch
          persist-credentials: false
      - name: Generic contracts, independent services and display classes
        run: |
          for f in RiscPowerSleepV1.h RiscPowerKeyV1.h RiscDisplayPowerV1.h; do cmp "sdk/driver/$f" ".source/drivers/sdk/driver/$f"; done
          python3 -m unittest discover -s tests -t . -v
          python3 scripts/test_launcher_metadata.py --runtime .source/runtime --output dist/launcher-source --sanitize
          python3 scripts/check_capability_boundaries.py
          python3 scripts/test_capabilities.py
          python3 scripts/test_fast_wake_clock.py --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_clock_raster_gestures.py --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_fast_wake_clock.py --system-apps .source/system --utilities .source/utilities --automatic-provision --atomic --crash-report
          python3 scripts/test_fast_wake_clock.py --system-apps .source/system --utilities .source/utilities --automatic-provision --atomic --crash-report --native
          python3 scripts/test_home_native_height.py
          python3 scripts/test_packed_alpha.py
          python3 scripts/test_packed_calendar.py
          python3 scripts/test_calendar_ring_octants.py
          python3 scripts/test_packed_atlas_codec.py
          python3 scripts/test_packed_atlas_render.py
          python3 scripts/test_packed_atlas_render.py --sanitize
          python3 scripts/test_alarm_safe_area.py
          python3 scripts/test_native_faces.py
          python3 scripts/test_native_effects.py
          python3 scripts/test_crown_native_lifecycle.py --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_generic_preferences.py --system .source/system --utilities .source/utilities --output dist/generic-preferences
          python3 scripts/test_unified_default_contract.py --system .source/system --utilities .source/utilities --output dist/unified-default-contract
          python3 scripts/test_runtime_service_checkpoint.py --system .source/system --utilities .source/utilities --output dist/runtime-service-checkpoint
          python3 scripts/test_home_exit_checkpoint.py --system .source/system --utilities .source/utilities --output dist/home-exit-checkpoint
          python3 scripts/test_home_exit_checkpoint.py --system .source/system --utilities .source/utilities --output dist/home-exit-checkpoint-product --automatic-provision --atomic --crash-report
          for size in '240 240' '410 502'; do
            read width height <<< "$size"
            python3 scripts/test_home_confirmation_deferral.py --watch .source/baseline-watch --baseline --system .source/system --utilities .source/utilities --width "$width" --height "$height" --output "dist/home-confirmation/baseline-$width-$height"
            python3 scripts/test_home_confirmation_deferral.py --watch . --system .source/system --utilities .source/utilities --width "$width" --height "$height" --output "dist/home-confirmation/fixed-$width-$height"
          done
          python3 scripts/test_runtime_sleep.py --system .source/system --utilities .source/utilities --output dist/runtime-sleep
          python3 .source/system/scripts/test_quick_native.py
          python3 scripts/test_fast_wake_clock.py --native --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_clock_raster_gestures.py --native --output dist/clock-raster-gestures-native --system-apps .source/system --utilities .source/utilities
          python3 scripts/test_watch_layout.py
          python3 scripts/test_return_default.py --runtime .source/runtime
          python3 scripts/test_return_default.py --runtime .source/runtime --sanitize
          python3 scripts/test_capabilities.py --sanitize
          python3 scripts/test_viewport.py
          python3 scripts/test_viewport.py --sanitize
          python3 scripts/test_bringup_native.py --output dist/bringup-native
          python3 .source/drivers/scripts/test_legacy_power_bridge.py --sdk "$PWD/sdk/driver"
          python3 .source/drivers/scripts/test_legacy_power_bridge.py --sdk "$PWD/sdk/driver" --sanitize
      - name: Prepare pinned compiler
        run: |
          mkdir -p .source/toolchain
          curl --fail --location --retry 2 --max-time 180 https://github.com/espressif/crosstool-NG/releases/download/esp-15.2.0_20251204/xtensa-esp-elf-15.2.0_20251204-x86_64-linux-gnu.tar.xz -o "$RUNNER_TEMP/toolchain.tar.xz"
          echo "3d50f5cd5f173acfd524e07c1cd69bc99585731a415ca2e5bce879997fe602b8  $RUNNER_TEMP/toolchain.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/toolchain.tar.xz" -C .source/toolchain
          python3 -m pip install -r scripts/requirements.txt
      - name: Build and validate shared ELFs
        run: |
          python3 scripts/build.py --system .source/system --utilities .source/utilities --cc "$PWD/.source/toolchain/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc"
          python3 scripts/build.py --system .source/system --utilities .source/utilities --cc "$PWD/.source/toolchain/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc" --output dist/replay --role default
          python3 scripts/verify_shared_default.py --first dist --second dist/replay --receipt dist/shared-default-proof.json
          python3 scripts/build.py --system .source/system --utilities .source/utilities --cc "$PWD/.source/toolchain/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc" --automatic-provision --output dist/provisioning
          python3 scripts/build.py --system .source/system --utilities .source/utilities --cc "$PWD/.source/toolchain/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc" --automatic-provision --output dist/provisioning-replay --role default
          python3 scripts/verify_shared_default.py --first dist/provisioning --second dist/provisioning-replay --receipt dist/provisioning/shared-default-proof.json
          python3 .source/drivers/scripts/build_legacy_power_bridge.py --watch-sdk "$PWD" --cc "$PWD/.source/toolchain/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc" --validator dist/validate-elf --output dist/generic-power
          python3 scripts/test_launcher_metadata.py --runtime .source/runtime --artifacts dist --output dist/launcher-ordinary
          python3 scripts/test_launcher_metadata.py --runtime .source/runtime --artifacts dist/provisioning --output dist/launcher-provisioning
          python3 scripts/build.py --system .source/system --utilities .source/utilities --cc "$PWD/.source/toolchain/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc" --automatic-provision --serial-transfer-mode --output dist/transfer
          python3 scripts/test_launcher_metadata.py --runtime .source/runtime --artifacts dist/transfer --output dist/launcher-transfer
          git rev-parse HEAD > dist/COMMIT.txt
          git archive HEAD | gzip > dist/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: universal-watch-app
          path: |
            dist/default.elf
            dist/default.json
            dist/clock.elf
            dist/clock.json
            dist/provisioning/default.elf
            dist/provisioning/default.json
            dist/provisioning/clock.elf
            dist/provisioning/clock.json
            dist/provisioning/build.json
            dist/provisioning/shared-default-proof.json
            dist/generic-power/**/driver.elf
            dist/generic-power/**/manifest.json
            dist/generic-power/build.json
            dist/build.json
            dist/shared-default-proof.json
            dist/generic-preferences/receipt.json
            dist/unified-default-contract/receipt.json
            dist/runtime-service-checkpoint/receipt.json
            dist/home-exit-checkpoint/**
            dist/home-exit-checkpoint-product/**
            dist/home-confirmation/**
            dist/runtime-sleep/receipt.json
            dist/launcher-*/receipt.json
            dist/transfer/default.elf
            dist/transfer/default.json
            dist/transfer/clock.elf
            dist/transfer/clock.json
            dist/transfer/build.json
            dist/COMMIT.txt
            dist/source.tar.gz
          retention-days: 30
