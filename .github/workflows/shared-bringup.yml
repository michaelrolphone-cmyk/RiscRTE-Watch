name: Shared Bringup diagnostics
on:
  pull_request:
    paths: ['apps/bringup/**', 'scripts/*bringup*', 'tests/*bringup*', '.github/workflows/shared-bringup.yml']
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 710b200021b983ea55eb86a6fbddbbf5ce10a984
          path: System
          persist-credentials: false
      - name: Existing native raster and lifecycle
        run: python3 scripts/test_bringup_native.py --output out/native
      - name: Shared entry actual controller normal and sanitized
        run: |
          set -euo pipefail
          mkdir -p out/shared
          for mode in normal sanitized; do
            flags=(); if [ "$mode" = sanitized ]; then flags+=(-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer -no-pie); fi
            cc -std=c11 -O1 -g -Wall -Wextra -Werror -Wno-misleading-indentation "${flags[@]}" -ISystem/sdk/usb -ISystem/sdk/app -Iinclude -Isdk/app -Isdk/driver tests/shared_bringup_test.c apps/clock/viewport.c -o "out/shared/$mode"
            ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 "out/shared/$mode" 2>&1 | tee "out/shared/$mode.log"
          done
      - name: Pinned compiler
        run: |
          curl --fail --location --retry 3 https://github.com/espressif/crosstool-NG/releases/download/esp-15.2.0_20251204/xtensa-esp-elf-15.2.0_20251204-x86_64-linux-gnu.tar.xz -o "$RUNNER_TEMP/xtensa.tar.xz"
          echo "3d50f5cd5f173acfd524e07c1cd69bc99585731a415ca2e5bce879997fe602b8  $RUNNER_TEMP/xtensa.tar.xz" | sha256sum --check
          mkdir -p toolchain
          tar -xJf "$RUNNER_TEMP/xtensa.tar.xz" -C toolchain
      - name: One ELF and independent byte-identical repeat
        run: |
          python3 scripts/build_shared_bringup.py --system System --compiler toolchain/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc --output out/target
          python3 scripts/build_shared_bringup.py --system System --compiler toolchain/xtensa-esp-elf/bin/xtensa-esp32s3-elf-gcc --output out/repeat
          cmp out/target/bringup.elf out/repeat/bringup.elf
          git archive HEAD | gzip -n > out/source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-bringup-${{ github.event.pull_request.head.sha }}
          path: out/
          if-no-files-found: error

  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 710b200021b983ea55eb86a6fbddbbf5ce10a984
          path: System
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ab9ff33975680c5bb8d9a2e7ed346d0300732a4e
          path: Bootfs
          persist-credentials: false
      - name: Inspect published Home and Contexts baseline without new USB changes
        run: |
          python3 System/scripts/inspect_shared_usb_baseline.py --bootfs-tools Bootfs/scripts --output out/baseline
          python3 - <<'PY'
          import json
          from pathlib import Path
          for lane in ('watch','wave','x4'):
              root=Path('out/baseline')/lane/'before'
              boot=json.loads((root/'boot.json').read_text())
              found=[]
              for row in boot['app_capabilities']:
                  m=json.loads((root/row['manifest']).read_text())
                  if any(word in json.dumps(m).lower() for word in ('bringup','hardware test','diagnostic')):
                      found.append({'row':row,'manifest':m})
              print('BRINGUP BASELINE '+lane+' '+json.dumps(found),flush=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-bringup-baseline-${{ github.event.pull_request.head.sha }}
          path: out/baseline/
          if-no-files-found: error

  product-assembly:
    needs: [qualify, baseline]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: Watch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 710b200021b983ea55eb86a6fbddbbf5ce10a984
          path: System
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 712ecc3f894dba99d9c9638941778a82f5856b97
          path: Runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE
          ref: 0052d1fc42e9cfc82d626c5a247d460919c87935
          path: X4Runtime
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: c69d7914935fccdc04749f7bfa429c74219bf88a
          path: WatchProduct
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Wavshare-S3-Touch-AMOLED-2.06
          ref: 97ca6157aa9c3bba7c7fee3858aa7d0ff896d13b
          path: WaveProduct
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-XTEINK-X4-PRO
          ref: e361e73de14314bb4b8d2fb3a24eb81e2390b0ee
          path: X4Product
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: ab9ff33975680c5bb8d9a2e7ed346d0300732a4e
          path: Bootfs
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: shared-bringup-${{ github.event.pull_request.head.sha }}
          path: incoming/application
      - uses: actions/download-artifact@v4
        with:
          name: shared-bringup-baseline-${{ github.event.pull_request.head.sha }}
          path: incoming/baseline
      - name: Overlay invariants and cumulative fixed geometry products
        run: |
          set -euo pipefail
          python3 Watch/scripts/assemble_shared_bringup.py --system System --baseline incoming/baseline --application incoming/application/target --bootfs-tools Bootfs/scripts --output closure/assembly
          mkdir -p closure/application closure/source closure/baseline closure/qualification
          cp incoming/application/target/{bringup.elf,bringup.json,build.json,SOURCE-NOTICE.txt} closure/application/
          cp Watch/docs/shared-bringup/baseline.json closure/baseline/
          cp -a incoming/application/native incoming/application/shared closure/qualification
          for repo in Watch System Runtime X4Runtime WatchProduct WaveProduct X4Product Bootfs; do
            git -C "$repo" archive HEAD | gzip -n > "closure/source/$repo.tar.gz"
            git -C "$repo" rev-parse HEAD > "closure/source/$repo.head"
          done
      - name: Actual stored-byte Runtime admission, normal and sanitizers
        run: |
          set -euo pipefail
          for mode in normal sanitized; do
            flags=(); if [ "$mode" = sanitized ]; then flags+=(--sanitize); fi
            BRINGUP_SYSTEM="$PWD/System" python3 Watch/scripts/test_shared_bringup_product_admission.py --bringup --runtime Runtime --x4-runtime X4Runtime --watch-product WatchProduct --wave-product WaveProduct --x4-product X4Product --assembly closure/assembly --output "closure/admission/$mode" "${flags[@]}"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-bringup-qualified-products-${{ github.event.pull_request.head.sha }}
          path: closure/
          include-hidden-files: true
          if-no-files-found: error

  publish:
    needs: [product-assembly]
    if: github.event.pull_request.number == 23 && github.event.pull_request.head.ref == 'work/shared-bringup-20261102' && github.event.pull_request.head.repo.full_name == 'michaelrolphone-cmyk/RiscRTE-Watch'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: shared-bringup-qualified-products-${{ github.event.pull_request.head.sha }}
          path: closure
      - name: Publish verified Bringup-only product closure
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRINGUP_HEAD: ${{ github.event.pull_request.head.sha }}
          BRINGUP_BRANCH: ${{ github.event.pull_request.head.ref }}
          BRINGUP_PR: ${{ github.event.pull_request.number }}
        run: python3 scripts/publish_shared_bringup.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-bringup-publication-${{ github.event.pull_request.head.sha }}
          path: publication.json
          if-no-files-found: warn
