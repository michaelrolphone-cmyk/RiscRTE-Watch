name: Import current shared wake behavior
on:
  push:
    branches: [feat/universal-watch]
    paths: ['.github/workflows/import-fast-wake.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/universal-watch
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: 851b8998e804c57b2c9f42d9f8fd0a69e79f2b41
          path: .source/original-watch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-T-Watch-S3
          ref: fb01359770f457e410efe8cf7c7e0de5f3a43ebf
          path: .source/current-watch
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-System-Apps
          ref: 14762601b3fa7bbeeac5ed565a6825534bf74dca
          path: .source/system
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: michaelrolphone-cmyk/RiscRTE-Utilities
          ref: fc0bdbbbc600ce891e60c44d091fce0586ade7d8
          path: .source/utilities
          persist-credentials: false
      - name: Merge and test actual application source
        run: |
          python3 provenance/import_fast_wake.py
          python3 scripts/check_capability_boundaries.py
          python3 scripts/test_capabilities.py
          python3 scripts/test_capabilities.py --sanitize
          python3 scripts/test_viewport.py
          python3 scripts/test_viewport.py --sanitize
          python3 scripts/test_fast_wake_clock.py --system-apps .source/system --utilities .source/utilities
      - name: Commit checked-in source and tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps scripts tests provenance
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve Watch 1.1.16 first-frame and wake behavior in shared Home 0.14.0'
            git push origin HEAD:feat/universal-watch
          fi
